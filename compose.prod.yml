services:

  app:
    build:
      context: .
      target: app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
